name: Security and Pre-commit Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install UV
        run: |
          pip install uv

      - name: Install dependencies with UV
        run: |
          uv sync

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

  secret-detection:
    name: Detect secrets with git-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          sudo make install
          cd ..

      - name: Scan for secrets
        run: |
          git secrets --register-aws
          git secrets --scan

  scan:
    name: Lazarus Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Download lazarus_scanner.py
        run: curl -fsSL -o lazarus_scanner.py https://raw.githubusercontent.com/hngprojects/lazarus-scanner/main/lazarus_scanner.py

      - name: Run scanner
        run: python3 lazarus_scanner.py
